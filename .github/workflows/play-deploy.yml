name: Play 배포 (AAB 자동 빌드·업로드)

# 무엇: AAB 를 빌드해서 Google Play 에 자동 업로드 (수동 업로드 끝).
# 언제:
#  · [Run workflow] 버튼(workflow_dispatch) — 트랙 골라서 배포. 정식(production) 낼 때 이걸 씀.
#  · **push 로는 아무 데도 안 올라간다.** (2026-09-18 사장님)
#    테스트폰은 `adb install -r` 로 직접 깔고, 경우의 수를 통과한 다음에만
#    [Run workflow] 를 눌러 **플레이에** 올린다. (si0in.kr 업로드는 2026-09-18 제거)
#    전엔 push 마다 둘 다 자동으로 나가서, 베타 회원(13명)에게 검증 안 된 빌드가
#    '새 버전' 배너로 떴다.
# 준비물(1회): GitHub 저장소 Settings > Secrets 에 아래 6개 등록 — docs/PLAY_AUTO_DEPLOY_SETUP.md 참고.
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD / GOOGLE_SERVICES_JSON / PLAY_SERVICE_ACCOUNT_JSON
# versionCode: CI 는 git 커밋수+1 로 자동 산출(현재 커밋수 1179 > 마지막 1157 이라 안전). fetch-depth:0 필수.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "업로드 트랙 (internal=내부테스트 / production=정식출시)"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  group: play-deploy
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃 (전체 history — versionCode 바닥값=커밋수)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 셋업(캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 서명키 · google-services 복원 (비밀값 → 파일)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > ringgo-release.jks
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          # build.gradle.kts 가 rootProject.file("keystore.properties") 를 읽음. storeFile 은 root 기준 상대경로.
          {
            echo "storeFile=ringgo-release.jks"
            echo "storePassword=$KS_PW"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PW"
          } > keystore.properties
          # ── 복원 검증 — base64 손상/공백/원본직접입력 시 '어느 시크릿'인지 명확히 실패 ──
          if ! test -s ringgo-release.jks; then echo "::error::KEYSTORE_BASE64 시크릿이 비었거나 복원 실패"; exit 1; fi
          if ! test -s app/google-services.json; then echo "::error::GOOGLE_SERVICES_JSON 시크릿이 비었거나 복원 실패"; exit 1; fi
          if ! python3 -c "import json;json.load(open('app/google-services.json'))" 2>/dev/null; then
            echo "::error::GOOGLE_SERVICES_JSON 이 유효한 JSON 이 아님 — 원본을 그대로 넣지 말고 base64 로 저장하세요."
            echo "복원된 앞 60바이트:"; head -c 60 app/google-services.json; echo; exit 1
          fi
          if ! keytool -list -keystore ringgo-release.jks -storepass "$KS_PW" >/dev/null 2>&1; then
            echo "::error::keystore 를 못 엶 — KEYSTORE_BASE64(파일) 또는 KEYSTORE_PASSWORD(비번)가 틀림."
            exit 1
          fi
          echo "✓ keystore OK ($(wc -c < ringgo-release.jks) bytes) · google-services OK — 둘 다 검증 통과"

      - name: AAB 빌드 (서명·versionCode 자동)
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 빌드된 versionCode 확인
        run: |
          f=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB = $f"

      # 플레이에는 **시험을 통과한 것만** 올린다 — 이 워크플로 자체가 수동 실행 전용. (2026-09-18 사장님)
      - name: Play 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.detailline.callfollowcrm
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          # Play 스토어 "새로운 기능" 문구 — distribution/whatsnew/whatsnew-ko-KR 내용이 올라감.
          #   배포 전에 그 파일에 이번 변경 한 줄 적으면 됨(빈칸이면 문구 없이 올라감).
          whatsNewDirectory: distribution/whatsnew

      # si0in.kr APK 업로드는 **없앴다.** (2026-09-18 사장님)
      #   "사이트에서 apk 받아 쓰던 분들께 이제 플레이에서 받으라고 다 알렸다.
      #    사이트에 apk 올릴 필요 없다. apk 는 이제 너랑 나 테스트용이다."
      #   → 테스트폰은 `adb install -r` 로 로컬 빌드를 직접 깐다.
      #   ⚠️ 서버에 남아 있는 마지막 APK(1816)는 지우지 않았다. 앱의 '새 버전' 배너가
      #     그 버전을 보는데, 플레이가 앞서 나가면 배너는 안 뜬다. 배너를 플레이로
      #     돌리는 건 별도 작업.

      - name: AAB 아티팩트 보관 (Actions 에서 다운로드 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
