name: Play 배포 (AAB 자동 빌드·업로드)

# 무엇: AAB 를 빌드해서 Google Play 에 자동 업로드 (수동 업로드 끝).
# 언제:
#  · [Run workflow] 버튼(workflow_dispatch) — 트랙 골라서 배포. 정식(production) 낼 때 이걸 씀.
#  · main 에 app 코드 push — 자동으로 '내부 테스트(internal)' 트랙에 올림(심사 없음·빠름).
# 준비물(1회): GitHub 저장소 Settings > Secrets 에 아래 6개 등록 — docs/PLAY_AUTO_DEPLOY_SETUP.md 참고.
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD / GOOGLE_SERVICES_JSON / PLAY_SERVICE_ACCOUNT_JSON
# versionCode: CI 는 git 커밋수+1 로 자동 산출(현재 커밋수 1179 > 마지막 1157 이라 안전). fetch-depth:0 필수.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "업로드 트랙 (internal=내부테스트 / production=정식출시)"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"

concurrency:
  group: play-deploy
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃 (전체 history — versionCode 바닥값=커밋수)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 셋업(캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 서명키 · google-services 복원 (비밀값 → 파일)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > ringgo-release.jks
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          # build.gradle.kts 가 rootProject.file("keystore.properties") 를 읽음. storeFile 은 root 기준 상대경로.
          {
            echo "storeFile=ringgo-release.jks"
            echo "storePassword=$KS_PW"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PW"
          } > keystore.properties
          # ── 복원 검증 — base64 손상/공백/원본직접입력 시 '어느 시크릿'인지 명확히 실패 ──
          if ! test -s ringgo-release.jks; then echo "::error::KEYSTORE_BASE64 시크릿이 비었거나 복원 실패"; exit 1; fi
          if ! test -s app/google-services.json; then echo "::error::GOOGLE_SERVICES_JSON 시크릿이 비었거나 복원 실패"; exit 1; fi
          if ! python3 -c "import json;json.load(open('app/google-services.json'))" 2>/dev/null; then
            echo "::error::GOOGLE_SERVICES_JSON 이 유효한 JSON 이 아님 — 원본을 그대로 넣지 말고 base64 로 저장하세요."
            echo "복원된 앞 60바이트:"; head -c 60 app/google-services.json; echo; exit 1
          fi
          if ! keytool -list -keystore ringgo-release.jks -storepass "$KS_PW" >/dev/null 2>&1; then
            echo "::error::keystore 를 못 엶 — KEYSTORE_BASE64(파일) 또는 KEYSTORE_PASSWORD(비번)가 틀림."
            exit 1
          fi
          echo "✓ keystore OK ($(wc -c < ringgo-release.jks) bytes) · google-services OK — 둘 다 검증 통과"

      - name: AAB 빌드 (서명·versionCode 자동)
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 빌드된 versionCode 확인
        run: |
          f=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB = $f"

      - name: Play 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.detailline.callfollowcrm
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          # Play 스토어 "새로운 기능" 문구 — distribution/whatsnew/whatsnew-ko-KR 내용이 올라감.
          #   배포 전에 그 파일에 이번 변경 한 줄 적으면 됨(빈칸이면 문구 없이 올라감).
          whatsNewDirectory: distribution/whatsnew

      # si0in.kr 자동 배포 — release APK 를 빌드해 서버로 올리면 즉시 서빙 교체.
      #   서버 /api/download/version 이 새 versionCode 를 읽어 앱 '새 버전' 배너가 떠서
      #   si0in.kr 로 설치한 테스터는 인앱에서 바로 업데이트 가능. (2026-08-24 사장님 — 자동배포)
      #   ⚠️ Play 서명과 별개(ringgo-release.jks 직접 서명) — Play 로 깐 폰과는 서명 달라 교차설치 불가.
      - name: si0in.kr APK 빌드 + 자동 업로드
        env:
          SI0IN_UPLOAD_TOKEN: ${{ secrets.SI0IN_UPLOAD_TOKEN }}
        run: |
          set -e
          if [ -z "$SI0IN_UPLOAD_TOKEN" ]; then
            echo "::error::SI0IN_UPLOAD_TOKEN 시크릿이 없음 — si0in.kr 자동배포 스킵 불가"; exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK = $apk ($(wc -c < "$apk") bytes)"
          notes=$(git log -1 --pretty=%s)
          code=$(curl -sS -o /tmp/upl.json -w '%{http_code}' -X POST https://api.si0in.kr/internal/upload-apk \
            -H "Authorization: Bearer $SI0IN_UPLOAD_TOKEN" \
            -H "X-Release-Notes: $notes" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$apk")
          echo "upload http=$code"; cat /tmp/upl.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then echo "::error::si0in.kr APK 업로드 실패 (http $code)"; exit 1; fi
          echo "✓ si0in.kr 자동 배포 완료"

      - name: AAB 아티팩트 보관 (Actions 에서 다운로드 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
