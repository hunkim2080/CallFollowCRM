<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#181D27; --ink2:#4E5968; --ink3:#8B95A1; --line:#E5E9EE;
    --surface:#fff; --sunken:#F5F7F9; --green:#12B886; --green-bg:#E6F9F1;
    --naver:#03C75A; --amber-bg:#FBF3E4; --amber:#B7791F; --red:#E03131;
    --blue:#3182F6; --blue-bg:#EDF3FF;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  body{width:344px;margin:0;font-family:var(--font);background:var(--surface);color:var(--ink);padding:14px 14px 16px}
  .hd{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:850;letter-spacing:-.01em;margin-bottom:3px}
  .hd .b{color:var(--naver)}
  .desc{font-size:11.5px;color:var(--ink3);margin-bottom:10px;line-height:1.5}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 11px;margin-bottom:10px}
  .chip.ok{color:var(--naver);background:var(--green-bg)}
  .chip.off{color:var(--amber);background:var(--amber-bg)}
  .lblrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
  .lbl{font-size:11.5px;font-weight:800;color:var(--ink2)}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;font-family:var(--font);font-size:10.5px;font-weight:800;color:var(--ink2);padding:4px 9px;cursor:pointer}
  .mini:active{transform:scale(.97)}
  textarea{width:100%;height:132px;resize:vertical;border:1px solid var(--line);border-radius:11px;
    padding:10px 11px;font-family:var(--font);font-size:12.5px;line-height:1.6;color:var(--ink);background:var(--sunken);outline:none}
  textarea:focus{border-color:var(--naver);background:#fff}
  .hint{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.55}
  .hint b{color:var(--ink2)}
  .btn{width:100%;margin-top:10px;border:0;border-radius:12px;background:var(--naver);color:#fff;
    font-family:var(--font);font-size:14px;font-weight:850;padding:12px;cursor:pointer;letter-spacing:-.01em}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:#C9D0D8;cursor:default;transform:none}
  .paste{margin-top:9px;display:none;background:var(--blue-bg);border:1px solid #cfe0ff;border-radius:11px;padding:11px 12px}
  .paste .big{font-size:13px;font-weight:850;color:var(--blue);line-height:1.5}
  .paste .kbd{display:inline-block;border:1px solid #b9cdf2;background:#fff;border-radius:6px;padding:1px 7px;font-weight:850;font-size:12px;margin:0 1px}
  .paste .sm{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.5}
  .out{font-size:12px;font-weight:700;margin-top:9px;min-height:15px;line-height:1.5;color:var(--ink2)}
  .out.ok{color:var(--naver)} .out.err{color:var(--red)}
  .auto{margin-top:10px;text-align:center}
  .auto button{border:0;background:none;color:var(--ink3);font-family:var(--font);font-size:11px;font-weight:800;text-decoration:underline;cursor:pointer}
  .steps{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);line-height:1.65}
  .steps b{color:var(--ink2)}
</style>
</head>
<body>
  <div class="hd">🧩 <span>시공막내</span> · <span class="b">네이버 블로그 넣기</span></div>
  <div class="desc">시공막내에서 만든 글을 <b>서식(소제목·인용구·굵게)까지</b> 네이버 블로그에 넣어줍니다.</div>

  <div id="chip" class="chip off">○ 상태 확인 중…</div>

  <div class="lblrow">
    <span class="lbl">네이버에 넣을 글</span>
    <button id="sample" class="mini">예시 넣기</button>
  </div>
  <textarea id="text" placeholder="시공막내에서 만든 블로그 글을 여기에 붙여넣으세요."></textarea>
  <div class="hint"><b>서식 마커</b> — <b>## </b>소제목 · <b>&gt; </b>인용구 · <b>**굵게**</b> · <b>---</b> 구분선. 그대로 네이버 서식으로 들어가요.</div>

  <button id="btn" class="btn">네이버용으로 복사</button>

  <div id="paste" class="paste">
    <div class="big">복사됐어요! 이제 네이버 본문 클릭 → <span class="kbd">Ctrl</span>+<span class="kbd">V</span></div>
    <div class="sm">사람이 붙여넣는 것과 똑같아서 소제목·인용구·굵게·구분선까지 그대로 들어가요.</div>
  </div>
  <div id="out" class="out"></div>

  <div class="auto"><button id="autoBtn">⚡ 자동으로 넣어보기 (실험)</button></div>

  <div class="steps">
    <b>순서</b> ① 네이버 블로그 <b>글쓰기</b> 열기 → ② <b>[네이버용으로 복사]</b> → ③ 본문 클릭하고 <b>Ctrl+V</b>.
  </div>

  <script src="format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
