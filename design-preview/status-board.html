<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RING-GO · 프로토타입 → 앱 반영 현황판</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --line:#ECEEF1;
    --t1:#0B1220; --t2:#4E5968; --t3:#8B95A1;
    --blue:#3182F6; --blue-dark:#1B64DA; --blue-tint:#EEF4FF;
    --done:#16C172; --done-tint:#E7F8EF;
    --review:#F59E0B; --review-tint:#FEF6E7;
    --prog:#3182F6; --prog-tint:#EAF2FF;
    --todo:#B0B8C1; --todo-tint:#F2F4F6;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,30,55,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--t1);
    font-family:'Pretendard',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}

  /* header */
  .h-title{font-size:24px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
  .h-sub{margin-top:8px;font-size:14px;line-height:1.6;color:var(--t2)}
  .h-meta{margin-top:6px;font-size:12px;color:var(--t3)}

  /* progress hero */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:22px 22px 20px;margin-top:18px;box-shadow:var(--shadow)}
  .hero-k{font-size:13px;font-weight:600;color:var(--t2)}
  .hero-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
  .hero-big{font-size:34px;font-weight:800;letter-spacing:-1px}
  .hero-big small{font-size:17px;font-weight:700;color:var(--t3)}
  .hero-pct{font-size:30px;font-weight:800;color:var(--done)}
  .bar{margin-top:16px;height:12px;border-radius:99px;background:var(--todo-tint);
    overflow:hidden;display:flex}
  .bar i{height:100%;display:block;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar .s-done{background:linear-gradient(90deg,#16C172,#16C99B)}
  .bar .s-review{background:var(--review)}
  .bar .s-prog{background:var(--blue)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
  .legend span{font-size:12.5px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:99px;display:inline-block}
  .dot.done{background:var(--done)} .dot.review{background:var(--review)}
  .dot.prog{background:var(--blue)} .dot.todo{background:var(--todo)}

  /* filters */
  .filters{display:flex;gap:8px;margin-top:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--t2);
    font-size:13px;font-weight:700;padding:9px 15px;border-radius:99px;cursor:pointer;transition:.15s}
  .fchip[data-on="1"]{background:var(--t1);color:#fff;border-color:var(--t1)}
  .fchip .cnt{opacity:.55;margin-left:5px;font-weight:600}

  /* area */
  .area{margin-top:24px}
  .area-h{display:flex;align-items:center;gap:10px;padding:0 4px 2px}
  .area-emo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    font-size:18px;background:var(--blue-tint)}
  .area-name{font-size:16px;font-weight:800}
  .area-desc{font-size:12.5px;color:var(--t3);margin-top:1px}
  .area-mini{margin-left:auto;font-size:12px;font-weight:700;color:var(--t3)}
  .area-card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}

  /* item */
  .item{padding:15px 17px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
  .item:first-child{border-top:none}
  .item:active{background:#FAFBFC}
  .item-top{display:flex;align-items:center;gap:10px}
  .item-name{font-size:14.5px;font-weight:700;flex:1;line-height:1.35}
  .badge{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
  .b-done{background:var(--done-tint);color:#0E9D5C}
  .b-review{background:var(--review-tint);color:#C77B05}
  .b-prog{background:var(--prog-tint);color:var(--blue-dark)}
  .b-todo{background:var(--todo-tint);color:#6B7684}
  .item-body{max-height:0;overflow:hidden;transition:max-height .28s ease;}
  .item.open .item-body{max-height:340px}
  .item-desc{font-size:13px;line-height:1.65;color:var(--t2);padding-top:11px}
  .item-app{margin-top:10px;background:#F8F9FB;border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--t2)}
  .item-app b{color:var(--t1);font-weight:700}
  .chev{flex:0 0 auto;color:var(--t3);transition:transform .25s;font-size:13px}
  .item.open .chev{transform:rotate(90deg)}

  .foot{margin-top:34px;text-align:center;font-size:12px;color:var(--t3);line-height:1.7}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="h-title">📊 프로토타입 → 앱 반영 현황판</div>
  <div class="h-sub">프리뷰(<b>ringgo-redesign.html</b>)에서 그린 디자인·기능이, 실제 안드로이드 앱에 <b>뭐가 들어갔고 뭐가 아직인지</b> 한눈에 봅니다.<br>전문 용어 없이 = 사장님이 직접 진행 상태를 확인할 수 있어요.</div>
  <div class="h-meta" id="meta">마지막 갱신 · 2026-06-01</div>

  <div class="hero">
    <div class="hero-k">전체 진행</div>
    <div class="hero-row">
      <div class="hero-big" id="bigNum">0 <small>/ 0 완료</small></div>
      <div class="hero-pct" id="pct">0%</div>
    </div>
    <div class="bar">
      <i class="s-done" id="barDone" style="width:0"></i>
      <i class="s-review" id="barReview" style="width:0"></i>
      <i class="s-prog" id="barProg" style="width:0"></i>
    </div>
    <div class="legend">
      <span><i class="dot todo"></i>시작 전 <b id="lgTodo">0</b></span>
      <span><i class="dot prog"></i>진행 중 <b id="lgProg">0</b></span>
      <span><i class="dot review"></i>검수 중 <b id="lgReview">0</b></span>
      <span><i class="dot done"></i>완료 <b id="lgDone">0</b></span>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="board"></div>

  <div class="foot">RING-GO 내부 현황판 · 프로토 169개 기능 ↔ 실제 앱(Android, DB v19) 대조<br>항목을 누르면 자세한 설명과 "실제 앱 어디에" 가 펼쳐져요.</div>
</div>

var LABELS = {done:'완료', review:'검수 중', prog:'진행 중', todo:'시작 전'};
var BADGE = {done:'b-done', review:'b-review', prog:'b-prog', todo:'b-todo'};
var ORDER = ['todo','prog','review','done'];

/* ── compute totals ── */
var all = [];
AREAS.forEach(function(a){ a.items.forEach(function(it){ all.push(it); }); });
var total = all.length;
var cnt = {done:0,review:0,prog:0,todo:0};
all.forEach(function(it){ cnt[it.s]++; });

document.getElementById('bigNum').innerHTML = cnt.done+' <small>/ '+total+' 완료</small>';
var pct = Math.round(cnt.done/total*100);
document.getElementById('pct').textContent = pct+'%';
document.getElementById('barDone').style.width   = (cnt.done/total*100)+'%';
document.getElementById('barReview').style.width = (cnt.review/total*100)+'%';
document.getElementById('barProg').style.width   = (cnt.prog/total*100)+'%';
document.getElementById('lgDone').textContent   = cnt.done;
document.getElementById('lgReview').textContent = cnt.review;
document.getElementById('lgProg').textContent   = cnt.prog;
document.getElementById('lgTodo').textContent   = cnt.todo;

/* ── filters ── */
var FILTERS = [
  {k:'all',   label:'전체',   c:total},
  {k:'todo',  label:'시작 전', c:cnt.todo},
  {k:'prog',  label:'진행 중', c:cnt.prog},
  {k:'review',label:'검수 중', c:cnt.review},
  {k:'done',  label:'완료',   c:cnt.done},
];
var curFilter = 'all';
var fEl = document.getElementById('filters');
FILTERS.forEach(function(f){
  var b = document.createElement('div');
  b.className='fchip'; b.setAttribute('data-k',f.k);
  b.setAttribute('data-on', f.k==='all'?'1':'0');
  b.innerHTML = f.label+'<span class="cnt">'+f.c+'</span>';
  b.onclick=function(){ setFilter(f.k); };
  fEl.appendChild(b);
});
function setFilter(k){
  curFilter=k;
  [].forEach.call(fEl.children,function(c){ c.setAttribute('data-on', c.getAttribute('data-k')===k?'1':'0'); });
  render();
}

/* ── render board ── */
var board = document.getElementById('board');
function render(){
  board.innerHTML='';
  AREAS.forEach(function(a){
    var items = a.items.filter(function(it){ return curFilter==='all' || it.s===curFilter; });
    // sort within area by ORDER (todo first)
    items = items.slice().sort(function(x,y){ return ORDER.indexOf(x.s)-ORDER.indexOf(y.s); });
    if(!items.length) return;
    var done = a.items.filter(function(it){return it.s==='done';}).length;

    var area = document.createElement('div'); area.className='area';
    var head = document.createElement('div'); head.className='area-h';
    head.innerHTML = '<div class="area-emo">'+a.emo+'</div>'+
      '<div><div class="area-name">'+a.name+'</div><div class="area-desc">'+a.desc+'</div></div>'+
      '<div class="area-mini">'+done+'/'+a.items.length+'</div>';
    area.appendChild(head);

    var card = document.createElement('div'); card.className='area-card';
    items.forEach(function(it){
      var row = document.createElement('div'); row.className='item';
      row.innerHTML =
        '<div class="item-top">'+
          '<div class="item-name">'+it.n+'</div>'+
          '<span class="badge '+BADGE[it.s]+'">'+LABELS[it.s]+'</span>'+
          '<span class="chev">▶</span>'+
        '</div>'+
        '<div class="item-body">'+
          '<div class="item-desc">'+it.d+'</div>'+
          '<div class="item-app"><b>실제 앱:</b> '+it.a+'</div>'+
        '</div>';
      row.onclick=function(){ row.classList.toggle('open'); };
      card.appendChild(row);
    });
    area.appendChild(card);
    board.appendChild(area);
  });
}
render();
</script>
